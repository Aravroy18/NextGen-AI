
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXTGEN AI - Live Voice</title>

<style>
    body {
        margin: 0;
        padding: 20px;
        background: #080817;
        color: white;
        font-family: Arial, sans-serif;
    }

    .container {
        max-width: 700px;
        margin: auto;
        padding: 22px;
        background: #15152e;
        border: 1px solid #454078;
        border-radius: 18px;
    }

    h2 {
        color: #a78bfa;
        text-align: center;
    }

    #status {
        padding: 12px;
        margin: 15px 0;
        background: #252545;
        border-radius: 10px;
        text-align: center;
    }

    .buttons {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
    }

    button {
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    #startBtn {
        background: #7c3aed;
    }

    #stopBtn {
        background: #dc2626;
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    #conversation {
        margin-top: 20px;
        padding: 15px;
        min-height: 180px;
        max-height: 300px;
        overflow-y: auto;
        background: #0b0b20;
        border-radius: 10px;
        white-space: pre-wrap;
    }

    .user {
        color: #93c5fd;
        margin-bottom: 12px;
    }

    .assistant {
        color: #c4b5fd;
        margin-bottom: 12px;
    }
</style>
</head>

<body>

<div class="container">

    <h2>🚀 NEXTGEN AI LIVE VOICE</h2>

    <div id="status">Status: Not Connected</div>

    <div class="buttons">
        <button id="startBtn" onclick="startCall()">
            📞 Start Live Call
        </button>

        <button id="stopBtn" onclick="stopCall()" disabled>
            ⏹ Stop Call
        </button>
    </div>

    <div id="conversation">
        Your live conversation will appear here.
    </div>

</div>

<script>
const TOKEN = "__LIVE_TOKEN__";
const MODEL = "gemini-3.8-live";

let ws = null;
let micStream = null;
let micContext = null;
let outputContext = null;
let processor = null;
let micSource = null;
let setupDone = false;
let nextPlayTime = 0;
let activeSources = new Set();

const statusBox = document.getElementById("status");
const conversation = document.getElementById("conversation");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");

function setStatus(message) {
    statusBox.textContent = "Status: " + message;
}

function addMessage(type, message) {
    const div = document.createElement("div");
    div.className = type;
    div.textContent =
        (type === "user" ? "You: " : "NEXTGEN AI: ") + message;

    conversation.appendChild(div);
    conversation.scrollTop = conversation.scrollHeight;
}

function base64ToBytes(base64) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    return bytes;
}

function floatToPCM16(floatData) {
    const pcm = new Int16Array(floatData.length);

    for (let i = 0; i < floatData.length; i++) {
        const sample = Math.max(-1, Math.min(1, floatData[i]));

        pcm[i] = sample < 0
            ? sample * 32768
            : sample * 32767;
    }

    return pcm;
}

function resampleTo16k(input, sourceRate) {
    const targetRate = 16000;

    if (sourceRate === targetRate) {
        return input;
    }

    const outputLength = Math.floor(
        input.length * targetRate / sourceRate
    );

    const output = new Float32Array(outputLength);
    const ratio = sourceRate / targetRate;

    for (let i = 0; i < outputLength; i++) {
        const position = i * ratio;
        const index = Math.floor(position);
        const fraction = position - index;

        const first = input[index] || 0;
        const second = input[index + 1] || first;

        output[i] = first + (second - first) * fraction;
    }

    return output;
}

function pcmToBase64(pcm) {
    const bytes = new Uint8Array(
        pcm.buffer,
        pcm.byteOffset,
        pcm.byteLength
    );

    let binary = "";

    for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
    }

    return btoa(binary);
}

async function startCall() {
    try {
        if (!TOKEN || TOKEN === "__LIVE_TOKEN__") {
            setStatus("Live token missing. Generate a fresh token.");
            return;
        }

        startBtn.disabled = true;
        setStatus("Connecting to Gemini...");

        outputContext = new AudioContext({
            sampleRate: 24000
        });

        await outputContext.resume();

        const endpoint =
            "wss://generativelanguage.googleapis.com/ws/" +
            "google.ai.generativelanguage.v1beta.GenerativeService." +
            "BidiGenerateContentConstrained?access_token=" +
            encodeURIComponent(TOKEN);

        ws = new WebSocket(endpoint);

        ws.onopen = function() {
            setStatus("Connected. Configuring AI...");

            ws.send(JSON.stringify({
                setup: {
                    model: "models/" + MODEL,

                    generationConfig: {
                        responseModalities: ["AUDIO"]
                    },

                    inputAudioTranscription: {},
                    outputAudioTranscription: {}
                }
            }));
        };

        ws.onmessage = async function(event) {
            try {
                const message = JSON.parse(event.data);

                if (message.setupComplete) {
                    setupDone = true;

                    setStatus("Connected. Starting microphone...");

                    await startMicrophone();

                    stopBtn.disabled = false;
                    setStatus("Live Call Active. Speak now!");
                }

                if (message.error) {
                    setStatus(
                        "API Error: " +
                        (message.error.message || "Unknown error")
                    );
                }

                const content = message.serverContent;

                if (content) {
                    if (content.inputTranscription &&
                        content.inputTranscription.text) {

                        addMessage(
                            "user",
                            content.inputTranscription.text
                        );
                    }

                    if (content.outputTranscription &&
                        content.outputTranscription.text) {

                        addMessage(
                            "assistant",
                            content.outputTranscription.text
                        );
                    }

                    if (content.interrupted) {
                        stopAudioPlayback();
                    }

                    if (content.modelTurn &&
                        content.modelTurn.parts) {

                        for (const part of content.modelTurn.parts) {
                            if (part.inlineData &&
                                part.inlineData.data) {

                                await playAudio(
                                    part.inlineData.data,
                                    part.inlineData.mimeType
                                );
                            }
                        }
                    }

                    if (content.turnComplete) {
                        setStatus("AI replied. You can speak again.");
                    }
                }

            } catch (error) {
                console.error("Message Error:", error);
                setStatus("Message processing error: " + error.message);
            }
        };

        ws.onerror = function(error) {
            console.error("WebSocket Error:", error);
            setStatus("WebSocket connection error.");
            startBtn.disabled = false;
        };

        ws.onclose = function(event) {
            setupDone = false;
            stopMicrophone();
            setStatus(
                "Connection closed. Code: " + event.code
            );
            startBtn.disabled = false;
            stopBtn.disabled = true;
        };

    } catch (error) {
        console.error(error);
        setStatus("Error: " + error.message);
        startBtn.disabled = false;
    }
}

async function startMicrophone() {
    micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
        }
    });

    micContext = new AudioContext({
        sampleRate: 16000
    });

    await micContext.resume();

    micSource = micContext.createMediaStreamSource(micStream);

    processor = micContext.createScriptProcessor(
        2048,
        1,
        1
    );

    processor.onaudioprocess = function(event) {
        if (!setupDone || !ws || ws.readyState !== WebSocket.OPEN) {
            return;
        }

        const input = event.inputBuffer.getChannelData(0);

        const resampled = resampleTo16k(
            input,
            micContext.sampleRate
        );

        const pcm = floatToPCM16(resampled);
        const base64Audio = pcmToBase64(pcm);

        ws.send(JSON.stringify({
            realtimeInput: {
                audio: {
                    mimeType: "audio/pcm;rate=16000",
                    data: base64Audio
                }
            }
        }));
    };

    micSource.connect(processor);
    processor.connect(micContext.destination);
}

async function playAudio(base64Audio, mimeType) {
    if (!outputContext) return;

    const bytes = base64ToBytes(base64Audio);
    const sampleCount = Math.floor(bytes.length / 2);

    const dataView = new DataView(
        bytes.buffer,
        bytes.byteOffset,
        bytes.byteLength
    );

    const samples = new Float32Array(sampleCount);

    for (let i = 0; i < sampleCount; i++) {
        samples[i] = dataView.getInt16(i * 2, true) / 32768;
    }

    const rateMatch = (mimeType || "").match(/rate=(\d+)/);
    const sampleRate = rateMatch
        ? Number(rateMatch[1])
        : 24000;

    const audioBuffer = outputContext.createBuffer(
        1,
        samples.length,
        sampleRate
    );

    audioBuffer.copyToChannel(samples, 0);

    const source = outputContext.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(outputContext.destination);

    const startTime = Math.max(
        outputContext.currentTime,
        nextPlayTime
    );

    source.start(startTime);
    nextPlayTime = startTime + audioBuffer.duration;

    activeSources.add(source);

    source.onended = function() {
        activeSources.delete(source);
    };
}

function stopAudioPlayback() {
    for (const source of activeSources) {
        try {
            source.stop();
        } catch (error) {}
    }

    activeSources.clear();

    if (outputContext) {
        nextPlayTime = outputContext.currentTime;
    }
}

function stopMicrophone() {
    setupDone = false;

    if (processor) {
        processor.disconnect();
        processor.onaudioprocess = null;
        processor = null;
    }

    if (micSource) {
        micSource.disconnect();
        micSource = null;
    }

    if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
        micStream = null;
    }

    if (micContext) {
        micContext.close();
        micContext = null;
    }
}

function stopCall() {
    setStatus("Stopping Live Call...");

    stopMicrophone();
    stopAudioPlayback();

    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
            realtimeInput: {
                audioStreamEnd: true
            }
        }));

        ws.close();
    } else if (ws) {
        ws.close();
    }

    if (outputContext) {
        outputContext.close();
        outputContext = null;
    }

    ws = null;
    startBtn.disabled = false;
    stopBtn.disabled = true;

    setStatus("Call stopped.");
}
</script>

</body>
</html>
