<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 16px;
    background: #090b10;
    color: #f4f5f7;
    font-family: Inter, Arial, sans-serif;
}

.voice-card {
    max-width: 760px;
    margin: auto;
    padding: 24px;
    border: 1px solid #252b38;
    border-radius: 22px;
    background: linear-gradient(145deg, #141923, #0d1119);
}

.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.title {
    font-size: 20px;
    font-weight: 700;
}

.status {
    color: #a3aab8;
    font-size: 13px;
}

.orb {
    width: 112px;
    height: 112px;
    margin: 30px auto;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #a6baff, #536dff 45%, #17204c);
    box-shadow: 0 0 45px #536dff55;
    transition: .3s;
}

.orb.active {
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 30px #536dff55; }
    50% { transform: scale(1.09); box-shadow: 0 0 65px #536dffaa; }
    100% { transform: scale(1); box-shadow: 0 0 30px #536dff55; }
}

.controls {
    display: flex;
    justify-content: center;
    gap: 12px;
}

button {
    border: 1px solid #343c4c;
    border-radius: 12px;
    padding: 13px 22px;
    color: white;
    background: #20293a;
    cursor: pointer;
    font-weight: 600;
}

button.primary {
    background: #526bff;
    border-color: #526bff;
}

button.danger {
    background: #a83245;
    border-color: #a83245;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.transcript {
    min-height: 95px;
    max-height: 210px;
    overflow-y: auto;
    margin-top: 25px;
    padding: 15px;
    border-radius: 13px;
    background: #090d14;
    border: 1px solid #242b39;
    color: #dce2ed;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
}

.note {
    margin-top: 14px;
    color: #858fa2;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="voice-card">

    <div class="top">
        <div class="title">NEXTGEN AI · Live Voice</div>
        <div class="status" id="status">Ready</div>
    </div>

    <div class="orb" id="orb"></div>

    <div class="controls">
        <button class="primary" id="start">Start call</button>
        <button class="danger" id="stop" disabled>End call</button>
    </div>

    <div class="transcript" id="transcript">
        Your conversation will appear here.
    </div>

    <div class="note">
        AI-generated voice. Microphone access is required for a live conversation.
    </div>

</div>

<script>
const CLIENT_SECRET = "__CLIENT_SECRET__";
const MODEL = "gpt-realtime";

const statusBox = document.getElementById("status");
const transcript = document.getElementById("transcript");
const orb = document.getElementById("orb");
const startButton = document.getElementById("start");
const stopButton = document.getElementById("stop");

let peer = null;
let stream = null;
let channel = null;

function status(text) {
    statusBox.textContent = text;
}

function addText(text) {
    transcript.textContent += "\n" + text;
    transcript.scrollTop = transcript.scrollHeight;
}

async function startCall() {
    if (!CLIENT_SECRET || CLIENT_SECRET.includes("__CLIENT_SECRET__")) {
        status("Missing live voice token.");
        return;
    }

    startButton.disabled = true;
    status("Connecting...");

    try {
        stream = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            }
        });

        peer = new RTCPeerConnection();

        const audio = document.createElement("audio");
        audio.autoplay = true;
        audio.playsInline = true;

        peer.ontrack = event => {
            audio.srcObject = event.streams[0];
            audio.play().catch(() => {});
        };

        stream.getTracks().forEach(track => {
            peer.addTrack(track, stream);
        });

        channel = peer.createDataChannel("oai-events");

        channel.onopen = () => {
            status("Connected");
            orb.classList.add("active");
            stopButton.disabled = false;
            addText("Connected to NEXTGEN AI.");
        };

        channel.onmessage = event => {
            try {
                const data = JSON.parse(event.data);

                if (
                    data.type === "conversation.item.input_audio_transcription.completed"
                ) {
                    addText("You: " + (data.transcript || ""));
                }

                if (
                    data.type === "response.output_audio_transcript.done"
                ) {
                    addText("NEXTGEN AI: " + (data.transcript || ""));
                }

                if (
                    data.type === "error"
                ) {
                    addText("Error: " + JSON.stringify(data.error));
                }
            } catch (error) {
                console.log(error);
            }
        };

        peer.onconnectionstatechange = () => {
            if (peer.connectionState === "failed") {
                status("Connection failed");
                stopCall();
            }
        };

        const offer = await peer.createOffer();

        await peer.setLocalDescription(offer);

        const response = await fetch(
            "https://api.openai.com/v1/realtime/calls",
            {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + CLIENT_SECRET,
                    "Content-Type": "application/sdp"
                },
                body: offer.sdp
            }
        );

        if (!response.ok) {
            throw new Error(await response.text());
        }

        const answer = {
            type: "answer",
            sdp: await response.text()
        };

        await peer.setRemoteDescription(answer);

    } catch (error) {
        status("Could not connect");
        addText("Error: " + error.message);
        stopCall();
    }
}

function stopCall() {
    if (channel) {
        channel.close();
        channel = null;
    }

    if (peer) {
        peer.close();
        peer = null;
    }

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    orb.classList.remove("active");
    status("Call ended");
    startButton.disabled = false;
    stopButton.disabled = true;
}

startButton.addEventListener("click", startCall);
stopButton.addEventListener("click", stopCall);
</script>

</body>
</html>
