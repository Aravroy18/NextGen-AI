<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 18px;
    background: #090b10;
    color: #f5f6fa;
    font-family: Inter, Arial, sans-serif;
}

.panel {
    max-width: 720px;
    margin: auto;
    padding: 24px;
    border: 1px solid #262e3d;
    border-radius: 20px;
    background: #111722;
}

h2 { margin-top: 0; }

textarea, select, input {
    width: 100%;
    padding: 13px;
    margin: 8px 0 16px;
    border: 1px solid #30394a;
    border-radius: 10px;
    background: #0a0e16;
    color: white;
}

textarea {
    min-height: 140px;
    resize: vertical;
}

button {
    padding: 13px 20px;
    border: 0;
    border-radius: 10px;
    background: #536dff;
    color: white;
    font-weight: 700;
    cursor: pointer;
}

button:disabled { opacity: .5; }

audio {
    width: 100%;
    margin-top: 18px;
}

.small {
    color: #929daf;
    font-size: 12px;
}
</style>
</head>

<body>
<div class="panel">
    <h2>Voice Studio</h2>
    <p class="small">Generate AI speech with selectable voices and speed.</p>

    <label>Enter your text</label>
    <textarea id="text" placeholder="Type something to speak..."></textarea>

    <label>Select voice</label>
    <select id="voice">
        <option value="marin">Marin</option>
        <option value="cedar">Cedar</option>
        <option value="nova">Nova</option>
        <option value="onyx">Onyx</option>
        <option value="echo">Echo</option>
        <option value="coral">Coral</option>
        <option value="ash">Ash</option>
        <option value="sage">Sage</option>
        <option value="shimmer">Shimmer</option>
        <option value="verse">Verse</option>
        <option value="alloy">Alloy</option>
        <option value="ballad">Ballad</option>
        <option value="fable">Fable</option>
    </select>

    <label>Speaking speed</label>
    <input id="speed" type="range" min="0.7" max="1.8" step="0.05" value="1.15">
    <div class="small" id="speedValue">1.15x</div>

    <br><br>
    <button id="generate">Generate voice</button>

    <audio id="player" controls></audio>

    <p class="small">
        This is an AI-generated voice, not a human recording.
    </p>
</div>

<script>
const button = document.getElementById("generate");
const speed = document.getElementById("speed");
const speedValue = document.getElementById("speedValue");
const player = document.getElementById("player");

speed.addEventListener("input", () => {
    speedValue.textContent = Number(speed.value).toFixed(2) + "x";
});

button.addEventListener("click", async () => {
    const text = document.getElementById("text").value.trim();

    if (!text) {
        alert("Please enter some text.");
        return;
    }

    button.disabled = true;
    button.textContent = "Generating...";

    try {
        const response = await fetch("/tts", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                text,
                voice: document.getElementById("voice").value,
                speed: Number(speed.value)
            })
        });

        if (!response.ok) {
            throw new Error(await response.text());
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);

        player.src = url;
        await player.play();

    } catch (error) {
        alert("Voice generation failed: " + error.message);
    } finally {
        button.disabled = false;
        button.textContent = "Generate voice";
    }
});
</script>
</body>
</html>
