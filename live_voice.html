
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXTGEN AI Live Voice</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    background: #080817;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 22px;
    background: #15152e;
    border: 1px solid #454078;
    border-radius: 20px;
    text-align: center;
}

h2 { color: #a78bfa; }

.orb {
    width: 125px;
    height: 125px;
    margin: 25px auto;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%,
        #e9d5ff, #8b5cf6 40%, #312e81 75%);
    box-shadow: 0 0 30px #8b5cf6, 0 0 70px #4f46e5;
    animation: pulse 1.8s infinite ease-in-out;
}

@keyframes pulse {
    0%,100% { transform: scale(.92); }
    50% { transform: scale(1.08); }
}

#status {
    padding: 12px;
    margin: 15px 0;
    background: #252545;
    border-radius: 10px;
}

.buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
}

button {
    padding: 13px 20px;
    border: none;
    border-radius: 10px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

#startBtn { background: #7c3aed; }
#stopBtn { background: #dc2626; }

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#conversation {
    margin-top: 20px;
    padding: 15px;
    min-height: 180px;
    max-height: 300px;
    overflow-y: auto;
    background: #0b0b20;
    border-radius: 10px;
    text-align: left;
    white-space: pre-wrap;
}

.user { color: #93c5fd; margin-bottom: 12px; }
.assistant { color: #c4b5fd; margin-bottom: 12px; }
</style>
</head>

<body>

<div class="container">
    <h2>🚀 NEXTGEN AI LIVE VOICE</h2>

    <div class="orb"></div>

    <div id="status">Status: Not Connected</div>

    <div class="buttons">
        <button id="startBtn">📞 Start Live Call</button>
        <button id="stopBtn" disabled>⏹ Stop Call</button>
    </div>

    <div id="conversation">
        Your live conversation will appear here.
    </div>
</div>

<script>
const TOKEN = "__LIVE_TOKEN__";
const MODEL = "gemini-3.8-live";

let ws = null;
let micStream = null;
let micContext = null;
let outputContext = null;
let processor = null;
let micSource = null;
let setupDone = false;
let nextPlayTime = 0;
let activeSources = new Set();

const statusBox = document.getElementById("status");
const conversation = document.getElementById("conversation");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");

function setStatus(message) {
    statusBox.textContent = "Status: " + message;
}

function addMessage(type, message) {
    const div = document.createElement("div");
    div.className = type;
    div.textContent =
        (type === "user" ? "You: " : "NEXTGEN AI: ") + message;

    conversation.appendChild(div);
    conversation.scrollTop = conversation.scrollHeight;
}

function base64ToBytes(base64) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    return bytes;
}

function floatToPCM16(floatData) {
    const pcm = new Int16Array(floatData.length);

    for (let i = 0; i < floatData.length; i++) {
        const sample = Math.max(-1, Math.min(1, floatData[i]));
        pcm[i] = sample < 0 ? sample * 32768 : sample * 32767;
    }

    return pcm;
}

function resampleTo16k(input, sourceRate) {
    const targetRate = 16000;

    if (sourceRate === targetRate) return input;

    const outputLength = Math.floor(
        input.length * targetRate / sourceRate
    );

    const output = new Float32Array(outputLength);
    const ratio = sourceRate / targetRate;

    for (let i = 0; i < outputLength; i++) {
        const position = i * ratio;
        const index = Math.floor(position);
        const fraction = position - index;

        const first = input[index] || 0;
        const second = input[index + 1] || first;

        output[i] = first + (second - first) * fraction;
    }

    return output;
}

function pcmToBase64(pcm) {
    const bytes = new Uint8Array(
        pcm.buffer, pcm.byteOffset, pcm.byteLength
    );

    let binary = "";

    for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
    }

    return btoa(binary);
}

async function startMicrophone() {
    micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
        }
    });

    micContext = new AudioContext({ sampleRate: 16000 });
    await micContext.resume();

    micSource = micContext.createMediaStreamSource(micStream);

    processor = micContext.createScriptProcessor(2048, 1, 1);

    processor.onaudioprocess = function(event) {
        if (!setupDone || !ws || ws.readyState !== WebSocket.OPEN) return;

        const input = event.inputBuffer.getChannelData(0);
        const resampled = resampleTo16k(input, micContext.sampleRate);
        const pcm = floatToPCM16(resampled);

        ws.send(JSON.stringify({
            realtimeInput: {
                audio: {
                    mimeType: "audio/pcm;rate=16000",
                    data: pcmToBase64(pcm)
                }
            }
        }));
    };

    micSource.connect(processor);
    processor.connect(micContext.destination);
}

async function playAudio(base64Audio, mimeType) {
    if (!outputContext) return;

    const bytes = base64ToBytes(base64Audio);
    const sampleCount = Math.floor(bytes.length / 2);

    const view = new DataView(
        bytes.buffer, bytes.byteOffset, bytes.byteLength
    );

    const samples = new Float32Array(sampleCount);

    for (let i = 0; i < sampleCount; i++) {
        samples[i] = view.getInt16(i * 2, true) / 32768;
    }

    const match = (mimeType || "").match(/rate=(\d+)/);
    const sampleRate = match ? Number(match[1]) : 24000;

    const buffer = outputContext.createBuffer(
        1, samples.length, sampleRate
    );

    buffer.copyToChannel(samples, 0);

    const source = outputContext.createBufferSource();
    source.buffer = buffer;
    source.connect(outputContext.destination);

    const startTime = Math.max(
        outputContext.currentTime, nextPlayTime
    );

    source.start(startTime);
    nextPlayTime = startTime + buffer.duration;

    activeSources.add(source);
    source.onended = () => activeSources.delete(source);
}

function stopAudioPlayback() {
    for (const source of activeSources) {
        try { source.stop(); } catch (error) {}
    }

    activeSources.clear();

    if (outputContext) {
        nextPlayTime = outputContext.currentTime;
    }
}

function stopMicrophone() {
    setupDone = false;

    if (processor) {
        processor.disconnect();
        processor.onaudioprocess = null;
        processor = null;
    }

    if (micSource) {
        micSource.disconnect();
        micSource = null;
    }

    if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
        micStream = null;
    }

    if (micContext) {
        micContext.close();
        micContext = null;
    }
}

async function startCall() {
    try {
        if (!TOKEN || TOKEN === "__LIVE_TOKEN__") {
            setStatus("Live token missing.");
            return;
        }

        startBtn.disabled = true;
        setStatus("Connecting to Gemini...");

        outputContext = new AudioContext({ sampleRate: 24000 });
        await outputContext.resume();

        const endpoint =
            "wss://generativelanguage.googleapis.com/ws/" +
            "google.ai.generativelanguage.v1beta.GenerativeService." +
            "BidiGenerateContent?access_token=" +
            encodeURIComponent(TOKEN);

        ws = new WebSocket(endpoint);

        ws.onopen = function() {
            setStatus("Connected. Configuring AI...");

            ws.send(JSON.stringify({
                setup: {
                    model: "models/" + MODEL,
                    generationConfig: {
                        responseModalities: ["AUDIO"]
                    },
                    inputAudioTranscription: {},
                    outputAudioTranscription: {}
                }
            }));
        };

        ws.onmessage = async function(event) {
            try {
                const message = JSON.parse(event.data);

                if (message.error) {
                    setStatus("API Error: " + message.error.message);
                    return;
                }

                if (message.setupComplete) {
                    setupDone = true;
                    await startMicrophone();
                    stopBtn.disabled = false;
                    setStatus("Live Call Active. Speak now!");
                }

                const content = message.serverContent;
                if (!content) return;

                if (content.inputTranscription?.text) {
                    addMessage("user", content.inputTranscription.text);
                }

                if (content.outputTranscription?.text) {
                    addMessage("assistant", content.outputTranscription.text);
                }

                if (content.interrupted) stopAudioPlayback();

                if (content.modelTurn?.parts) {
                    for (const part of content.modelTurn.parts) {
                        if (part.inlineData?.data) {
                            await playAudio(
                                part.inlineData.data,
                                part.inlineData.mimeType
                            );
                        }
                    }
                }

                if (content.turnComplete) {
                    setStatus("AI replied. You can speak again.");
                }

            } catch (error) {
                setStatus("Message error: " + error.message);
            }
        };

        ws.onerror = function() {
            setStatus("WebSocket connection error.");
            startBtn.disabled = false;
        };

        ws.onclose = function(event) {
            setupDone = false;
            stopMicrophone();
            setStatus("Connection closed. Code: " + event.code);
            startBtn.disabled = false;
            stopBtn.disabled = true;
        };

    } catch (error) {
        setStatus("Error: " + error.message);
        stopMicrophone();
        startBtn.disabled = false;
    }
}

function stopCall() {
    setStatus("Stopping Live Call...");

    stopMicrophone();
    stopAudioPlayback();

    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
            realtimeInput: { audioStreamEnd: true }
        }));
        ws.close();
    } else if (ws) {
        ws.close();
    }

    if (outputContext) {
        outputContext.close();
        outputContext = null;
    }

    ws = null;
    startBtn.disabled = false;
    stopBtn.disabled = true;

    setStatus("Call stopped.");
}

startBtn.addEventListener("click", startCall);
stopBtn.addEventListener("click", stopCall);
</script>

</body>
</html>
